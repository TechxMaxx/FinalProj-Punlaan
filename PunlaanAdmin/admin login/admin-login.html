<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Punlaan Admin — Sign in</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="admin-login.css?v=20260927d">
</head>

<body>

<main class="wrap">

  <section class="panel" aria-labelledby="title">

    <div class="mark" aria-hidden="true">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="5" y="11" width="14" height="10" rx="2"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
      </svg>
    </div>

    <h1 id="title">Admin access</h1>

    <p class="sub">
      Sign in with your Punlaan admin credentials.
    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm" novalidate>

      <div class="field">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          name="email"
          autocomplete="username"
          placeholder="you@punlaan.com"
          required
        >

        <span
          class="err"
          id="emailErr"
          role="alert"
        ></span>

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <div class="pw">

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="toggle"
            id="togglePw"
            aria-label="Show password"
            aria-pressed="false"
          >

            <svg
              class="eye-open"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              hidden
            >
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>

            <svg
              class="eye-closed"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 3l18 18"></path>
              <path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"></path>
              <path d="M6.5 6.7C3.9 8.3 2 12 2 12s4 7 11 7c1.8 0 3.4-.4 4.8-1.1"></path>
              <path d="M17.9 17.9C20.4 16.2 22 12 22 12s-1.6-3.9-5-5.9"></path>
            </svg>

          </button>

        </div>

        <span
          class="err"
          id="passwordErr"
          role="alert"
        ></span>

      </div>


      <button
        type="submit"
        class="submit"
        id="submitBtn"
      >
        <span class="label">
          Sign in
        </span>
      </button>


      <p
        class="formErr"
        id="formErr"
        role="alert"
      ></p>

    </form>


    <p class="notice">
      Restricted to authorized Punlaan staff.
      Access attempts are logged.
    </p>

  </section>

</main>

<script src="admin-login.js?v=20260927d"></script>

</body>
</html>
